version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: skyguard_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skyguard_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=skyguard_db
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skyguard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
